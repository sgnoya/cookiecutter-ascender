version: "3.8"

services:
  core:
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    build:
      args:
        - BASE_IMAGE=nvidia/cuda:12.9.0-devel-ubuntu24.04
        - PYTHON_VERSION=3.13
        - UID=${HOST_UID-1000}
        - GID=${HOST_GID-1000}
      context: ../../
      dockerfile: environments/Dockerfile
    tty: true
    volumes:
      - ../../:/home/user/{{ cookiecutter.project_slug }}
    ports:
      - 8000:8000
